<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Event</title>
  </head>
  <body>
    <a href="#main-content">Skip to main content</a>

    <header>
      <a href="/" aria-label="Event home">Event</a>
      <nav aria-label="Main navigation">
        <ul>
          <li><a href="#event-details">Event details</a></li>
          <li><a href="#rsvp">RSVP</a></li>
        </ul>
      </nav>
    </header>

    <main id="main-content">
      <section aria-labelledby="page-title">
        <h1 id="page-title">You're invited</h1>
        <p>Join us for our upcoming event.</p>
      </section>

      <section id="event-details" aria-labelledby="details-title">
        <h2 id="details-title">Event details</h2>
        <p>Date and time: <time datetime="2026-12-31T23:59:59Z">To be announced</time></p>
        <p id="countdown" role="status" aria-live="polite">Countdown unavailable</p>
      </section>

      <section id="rsvp" aria-labelledby="rsvp-title">
        <h2 id="rsvp-title">RSVP</h2>
        <form>
          <p>
            <label for="name">Name</label>
            <input id="name" name="name" autocomplete="name" required>
          </p>
          <p>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </p>
          <button type="submit">Send RSVP</button>
          <p id="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <footer>
      <p>We look forward to seeing you.</p>
    </footer>
  </body>
</html>
